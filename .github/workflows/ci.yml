name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

jobs:

  build:
    name: Build & Test (JDK ${{ matrix.java_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java_version: [17, 21, 25]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Check formatting
        run: mvn -B spotless:check

      - name: Build and test
        run: mvn -B -U test javadoc:aggregate

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          annotate_only: true

  junit-compat:
    name: JUnit Compatibility (JUnit ${{ matrix.junit.version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        junit:
          - version: '5.10.3'
            platform: '1.10.3'
          - version: '5.11.4'
            platform: '1.11.4'
          - version: '5.14.1'
            platform: '1.14.1'
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test dokimos-junit with JUnit ${{ matrix.junit.version }}
        run: mvn -B -U test -pl dokimos-junit -am -Djunit.version=${{ matrix.junit.version }} -Djunit.platform.version=${{ matrix.junit.platform }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        run: mvn -B -U verify -Dgroups=integration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/target/failsafe-reports/TEST-*.xml'
          annotate_only: true

  adapter-compat:
    name: Adapter Compat (${{ matrix.module }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # The koog rows disable the koog-live-it profile: that test builds an agent with koog's
        # construction API, which only resolves on the floor version, while the adapter itself
        # supports the whole range.
        include:
          - module: dokimos-langchain4j
            property: langchain4j.version
            version: '1.9.1'
          - module: dokimos-langchain4j
            property: langchain4j.version
            version: '1.11.0'
          - module: dokimos-spring-ai
            property: spring-ai.version
            version: '1.1.2'
          - module: dokimos-spring-ai
            property: spring-ai.version
            version: '1.1.6'
          - module: dokimos-koog
            property: koog.version
            version: '0.6.4'
            profiles: '-P!koog-live-it'
          - module: dokimos-koog
            property: koog.version
            version: '0.7.3'
            profiles: '-P!koog-live-it'
          - module: dokimos-koog
            property: koog.version
            version: '0.8.0'
            profiles: '-P!koog-live-it'
          - module: dokimos-koog
            property: koog.version
            version: '1.0.0'
            profiles: '-P!koog-live-it'
          # spring-ai-alibaba is not source-compatible across releases (1.0.0.4 added a checked
          # exception on CompiledGraph.invoke; 1.1.x relocated the agent types and changed the
          # ReactAgent builder), so we track the one supported version on the current 1.1.x line.
          - module: dokimos-spring-ai-alibaba
            property: spring-ai-alibaba.version
            version: '1.1.2.3'
          # Embabel ships Java 21 bytecode, so the module builds only on JDK 21+ (the embabel
          # profile). This job already runs on JDK 21, so the profile is active and -pl resolves it.
          - module: dokimos-embabel
            property: embabel.version
            version: '0.3.5'
            # 0.3.5 predates AgentProcess.totalUsage()/totalCost(); the adapter main calls them
            # reflectively, but the metrics test stubs them, so exclude that src/it test here.
            profiles: '-P!embabel-metrics-it'
          - module: dokimos-embabel
            property: embabel.version
            version: '0.4.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test ${{ matrix.module }} against ${{ matrix.property }}=${{ matrix.version }}
        run: mvn -B -U test -pl ${{ matrix.module }} -am -D${{ matrix.property }}=${{ matrix.version }} ${{ matrix.profiles }}

  eval-gate:
    name: Eval Gate (server-free)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Option A: a real regression fails this step. The report step still runs (if: always()),
      # and the gate writes a per-baseline verdict file before throwing, so the verdict is always available.
      - name: Run eval gate
        id: gate
        run: |
          # -am installs the upstream reactor chain dokimos-examples depends on (its sibling
          # SNAPSHOTs aren't on Maven Central), so the test step resolves them from the local repo.
          mvn -B -pl dokimos-examples -am install -DskipTests
          mvn -B -pl dokimos-examples test -Dtest=dev.dokimos.examples.gate.RegressionGateExampleTest -DfailIfNoTests=false

      - name: Report gate verdict
        if: always()
        uses: ./.github/actions/eval-gate-report
        with:
          verdict-dir: dokimos-examples/target/dokimos
