name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

jobs:

  build:
    name: Build & Test (JDK ${{ matrix.java_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java_version: [17, 21, 25]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Check formatting
        run: mvn -B spotless:check

      - name: Build and test
        run: mvn -B -U test javadoc:aggregate

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          annotate_only: true

  junit-compat:
    name: JUnit Compatibility (JUnit ${{ matrix.junit.version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        junit:
          - version: '5.10.3'
            platform: '1.10.3'
          - version: '5.11.4'
            platform: '1.11.4'
          - version: '5.14.1'
            platform: '1.14.1'
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test dokimos-junit with JUnit ${{ matrix.junit.version }}
        run: mvn -B -U test -pl dokimos-junit -am -Djunit.version=${{ matrix.junit.version }} -Djunit.platform.version=${{ matrix.junit.platform }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests
        run: mvn -B -U verify -Dgroups=integration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: '**/target/failsafe-reports/TEST-*.xml'
          annotate_only: true

  adapter-compat:
    name: Adapter Compat (${{ matrix.module }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Each version below was verified locally to compile and pass the adapter's tests.
        # Koog is pinned: its event-handler API changes across minor versions, so a
        # cross-version matrix would not compile. Bump this when koog is upgraded.
        include:
          - module: dokimos-langchain4j
            property: langchain4j.version
            version: '1.9.1'
          - module: dokimos-langchain4j
            property: langchain4j.version
            version: '1.11.0'
          - module: dokimos-spring-ai
            property: spring-ai.version
            version: '1.1.2'
          - module: dokimos-spring-ai
            property: spring-ai.version
            version: '1.1.6'
          - module: dokimos-koog
            property: koog.version
            version: '0.6.1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test ${{ matrix.module }} against ${{ matrix.property }}=${{ matrix.version }}
        run: mvn -B -U test -pl ${{ matrix.module }} -am -D${{ matrix.property }}=${{ matrix.version }}
