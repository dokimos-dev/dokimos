name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image:
        description: 'Which image to publish'
        type: choice
        options:
          - all
          - dokimos-server
          - dokimos-mcp-server
        default: all
      tag:
        description: 'Image tag (e.g., 0.1.0)'
        required: false
        default: 'latest'
      latest:
        description: 'Also tag as latest'
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Select images to build
        id: set
        run: |
          server='{"image":"dokimos-dev/dokimos-server","dockerfile":"dokimos-server/Dockerfile"}'
          mcp='{"image":"dokimos-dev/dokimos-mcp-server","dockerfile":"dokimos-mcp-server/Dockerfile"}'
          case "${{ github.event_name == 'release' && 'all' || inputs.image }}" in
            dokimos-server)     entries="$server" ;;
            dokimos-mcp-server) entries="$mcp" ;;
            *)                  entries="$server,$mcp" ;;
          esac
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event.inputs.tag == 'latest' || github.event.inputs.latest == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != 'latest' && github.event.inputs.tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
