server:
  port: ${SERVER_PORT:8080}

dokimos:
  api-key: ${DOKIMOS_API_KEY:}
  encryption-key: ${DOKIMOS_ENCRYPTION_KEY:}
  judge:
    poll-interval-ms: ${DOKIMOS_JUDGE_POLL_INTERVAL_MS:5000}
    max-attempts: ${DOKIMOS_JUDGE_MAX_ATTEMPTS:3}
    page-size: ${DOKIMOS_JUDGE_PAGE_SIZE:50}

spring:
  application:
    name: dokimos-server

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dokimos}
    username: ${DB_USERNAME:dokimos}
    password: ${DB_PASSWORD:dokimos}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    dev.dokimos.server: ${LOG_LEVEL:INFO}
    org.springframework: WARN
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
